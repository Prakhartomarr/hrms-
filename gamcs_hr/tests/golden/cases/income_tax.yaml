# Golden payroll cases: income tax (income-tax act 2025, tax year 2026-27).
# Money is integer paise (100 = Rs 1). Keys ending in _days/_pct/_date and the
# keys listed in loader.NON_MONEY are not money. A check with `pending` is reported
# as skipped with its feature until that feature lands; then remove the mark.
# Assumptions shared by every case: gamcs_hr/tests/golden/cases/_defaults.yaml.
area: Income tax (Income-tax Act 2025, tax year 2026-27)
cases:
- id: G33
  title: Festival bonus of 1,00,000 in November at CTC 18,00,000, new regime
  tags: [tds one-time]
  ca_signoff: true
  variants:
  - name: main
    scenario:
      kind: tds_month
      inputs:
        regime: new
        month: 2026-11
        ytd: {taxable: 103620000, tds: 8509800}
        current_month: 14700000
        future_monthly: 14700000
        one_time: 10000000
    checks:
      tds:
        pending: {feature: T66, reason: monthly TDS projection under the Income-tax Act 2025}
        expect: {projected_annual: 177120000, taxable_income: 169620000, slab_tax: 13924000, cess: 556960, annual_tax: 14481000,
          taxable_with_one_time: 179620000, slab_tax_with_one_time: 15924000, annual_tax_with_one_time: 16561000,
          tds_recurring: 1194200, tds_one_time: 2080000, tds: 3274200}
      net:
        pending:
          feature: [T57, T59, T66]
          reason: net needs PF, PT and TDS
        expect: {net: 21105800}
- id: G34

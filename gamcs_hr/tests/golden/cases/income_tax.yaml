- id: G36
  title: 'Old regime April projection: CTC 12L, Mumbai rent 30,000, deductions 1,75,000'
  tags: [old regime, hra]
  ca_signoff: true
  variants:
  - name: main
    scenario:
      kind: tds_month
      inputs:
        regime: old
        month: 2026-04
        ytd: {taxable: 0, tds: 0}
        current_month: 9820000
        future_monthly: 9820000
        hra_received_annual: 30000000
        rent_annual: 36000000
        basic_annual: 60000000
        city: Mumbai
        pt_annual: 250000
        deductions: {s123: 15000000, s126: 2500000}
    checks:
      hra:
        pending: {feature: T66, reason: 'HRA exemption, least of three'}
        expect: {hra_received: 30000000, rent_less_10pct: 30000000, salary_share: 30000000, hra_exempt: 30000000}
      tds:
        pending: {feature: T66, reason: monthly TDS projection under the Income-tax Act 2025}
        expect: {projected_annual: 117840000, standard_deduction: 5000000, taxable_income: 65090000, slab_tax: 4268000,
          cess: 170720, annual_tax: 4439000, tds: 369900}

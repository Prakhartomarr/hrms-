# Golden payroll cases: monthly statutory deductions.
# Money is integer paise (100 = Rs 1). Keys ending in _days/_pct/_date and the
# keys listed in loader.NON_MONEY are not money. A check with `pending` is reported
# as skipped with its feature until that feature lands; then remove the mark.
# Assumptions shared by every case: gamcs_hr/tests/golden/cases/_defaults.yaml.
area: Monthly statutory deductions
cases:
- id: G10
  title: Full month at CTC 12,00,000, Maharashtra man, new regime, November 2026
  tags: [monthly, pf capped]
  ca_signoff: true
  variants:
  - name: main
    scenario:
      kind: slip
      period: 2026-11
      employee: {gender: Male, state: Maharashtra, date_of_birth: '1990-05-01', date_of_joining: '2022-01-10'}
      structure:
      - {component: basic, monthly: 5000000, class: wages}
      - {component: hra, monthly: 2500000, class: exclusion}
      - {component: special, monthly: 2200000, class: wages}
      ytd: {taxable: 68620000, tds: 0}
    checks:
      earnings:
        expect: {paid_days: 30, basic: 5000000, hra: 2500000, special: 2200000, gross: 9700000}
      pf:
        pending: {feature: T57, reason: 'PF on code wages (Basic + Special) with the 25,000 ceiling and the employer
            EPS/EPF/EDLI/admin split'}
        expect: {code_wages: 7200000, pf_wages: 2500000, pf_ee: 300000, eps: 208300, epf_er: 91700, edli: 12500,
          pf_admin: 12500}
      esi:
        pending: {feature: T58, reason: ESI coverage tested on code wages}
        expect: {esi_ee: 0, esi_er: 0}
      pt:
        pending: {feature: T59, reason: Maharashtra PT slab}
        expect: {pt: 20000}
      tds:
        pending: {feature: T66, reason: monthly TDS projection under the Income-tax Act 2025}
        expect: {projected_annual: 117120000, taxable_income: 109620000, slab_tax: 4962000, rebate: 4962000, cess: 0,
          annual_tax: 0, tds: 0}
      net:
        pending:
          feature: [T57, T59, T66]
          reason: net needs PF, PT and TDS
        expect: {net: 9380000}

- id: G15
  title: ESI for a full month at code wages of 20,000
  tags: [esi rounding]
  ca_signoff: true
  variants:
  - name: main
    scenario:
      kind: slip
      period: 2026-11
      employee: {gender: Male, state: Karnataka, date_of_birth: '1990-05-01', date_of_joining: '2022-01-10'}
      structure:
      - {component: basic, monthly: 2000000, class: wages}
    checks:
      employee_share:
        note: Basic only, so gross equals code wages and the current gross-based rule applies.
        expect: {gross: 2000000, esi_ee: 15000}
      employer_share:
        pending: {feature: T58, reason: employer ESI share}
        expect: {esi_er: 65000}
- id: G16
  title: 'ESI: wages pass 21,000 inside a contribution period'
  tags: [esi contribution period]
  ca_signoff: true
  variants:
  - name: main
    scenario:
      kind: esi_periods
      inputs:
        months:
        - {month: 2026-06, code_wages: 2000000}
        - {month: 2026-07, code_wages: 2300000}
        - {month: 2026-09, code_wages: 2300000}
        - {month: 2026-10, code_wages: 2300000}
    checks:
      months:
        pending: {feature: T58, reason: 'contribution periods (Apr-Sep, Oct-Mar)'}
        expect:
          rows:
          - {month: 2026-06, covered: true, esi_ee: 15000, esi_er: 65000}
          - {month: 2026-07, covered: true, esi_ee: 17300, esi_er: 74800}
          - {month: 2026-09, covered: true, esi_ee: 17300, esi_er: 74800}
          - {month: 2026-10, covered: false, esi_ee: 0, esi_er: 0}
          flag: ESI_OVER_THRESHOLD
- id: G17
  title: 'Overtime: out of the ESI base unless the 50% test adds it back'
  tags: [esi, overtime]
  ca_signoff: true
  variants:
  - name: main
    scenario:
      kind: esi_month
      inputs:
        wages: 1400000
        tested_exclusions: 780000
        components: {basic: 1200000, special: 200000, hra: 480000, overtime: 300000}
    checks:
      default:
        pending:
          feature: [T56, T58]
          reason: ESI on code wages with the employer share and rounding up
        expect: {code_wages: 1400000, esi_ee: 10500, esi_er: 45500}
      overtime_in_base:
        pending: {feature: T58, reason: setting to keep overtime in the ESI base}
        expect: {esi_base: 1700000, esi_ee: 12800, esi_er: 55300}
- id: G18
  title: 'ESI low-wage exemption: daily average of 176 or less'
  tags: [esi exemption]
  ca_signoff: true
  variants:
  - name: main
    scenario:
      kind: esi_month
      inputs: {wages: 500000, tested_exclusions: 0, days: 30}
    checks:
      esi:
        pending: {feature: T58, reason: low-wage employee exemption}
        note: The current gross-based rule gives an employee share of 38.
        expect: {esi_ee: 0, esi_er: 16300}

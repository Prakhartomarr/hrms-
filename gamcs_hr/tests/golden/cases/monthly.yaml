- id: G12
  title: 'Low wage: ESI on code wages; Maharashtra man and woman on the G02 structure'
  tags: [esi code wages, pt gender]
  ca_signoff: true
  variants:
  - name: male
    scenario:
      kind: slip
      period: 2026-11
      employee: {gender: Male, state: Maharashtra, date_of_birth: '1990-05-01', date_of_joining: '2022-01-10'}
      structure:
      - {component: basic, monthly: 1000000, class: wages}
      - {component: hra, monthly: 400000, class: exclusion}
      - {component: special, monthly: 428600, class: wages}
    checks:
      earnings:
        expect: {paid_days: 30, basic: 1000000, hra: 400000, special: 428600, gross: 1828600}
      pf:
        pending: {feature: T57, reason: 'PF on code wages (Basic + Special) with the 25,000 ceiling and the employer
            EPS/EPF/EDLI/admin split'}
        expect: {code_wages: 1428600, pf_wages: 1428600, pf_ee: 171400, eps: 119000, epf_er: 52400, edli: 7100,
          pf_admin: 7100}
      esi:
        pending:
          feature: [T56, T58]
          reason: ESI on code wages with the employer share and rounding up
        note: On gross (the old basis) the employee share would be 138.
        expect: {esi_ee: 10800, esi_er: 46500}
      pt:
        pending: {feature: T59, reason: Maharashtra PT by gender}
        expect: {pt: 20000}
      net:
        pending:
          feature: [T57, T58, T59]
          reason: net needs PF, ESI and PT
        expect: {net: 1626400}
  - name: female
    scenario:
      kind: slip
      period: 2026-11
      employee: {gender: Female, state: Maharashtra, date_of_birth: '1990-05-01', date_of_joining: '2022-01-10'}
      structure:
      - {component: basic, monthly: 1000000, class: wages}
      - {component: hra, monthly: 400000, class: exclusion}
      - {component: special, monthly: 428600, class: wages}
    checks:
      earnings:
        expect: {paid_days: 30, basic: 1000000, hra: 400000, special: 428600, gross: 1828600}
      pf:
        pending: {feature: T57, reason: 'PF on code wages (Basic + Special) with the 25,000 ceiling and the employer
            EPS/EPF/EDLI/admin split'}
        expect: {code_wages: 1428600, pf_wages: 1428600, pf_ee: 171400, eps: 119000, epf_er: 52400, edli: 7100,
          pf_admin: 7100}
      esi:
        pending:
          feature: [T56, T58]
          reason: ESI on code wages with the employer share and rounding up
        note: On gross (the old basis) the employee share would be 138.
        expect: {esi_ee: 10800, esi_er: 46500}
      pt:
        pending: {feature: T59, reason: Maharashtra PT by gender}
        expect: {pt: 0}
      net:
        pending:
          feature: [T57, T58, T59]
          reason: net needs PF, ESI and PT
        expect: {net: 1646400}
- id: G13
  title: 'ESI coverage on code wages: 26,000 gross is still covered'
  tags: [esi coverage]
  ca_signoff: true
  variants:
  - name: main
    scenario:
      kind: esi_month
      inputs:
        wages: 1800000
        tested_exclusions: 800000
        components: {basic: 1600000, da: 200000, other_allowances: 800000}
    checks:
      esi:
        pending:
          feature: [T56, T58]
          reason: ESI on code wages with the employer share and rounding up
        expect: {code_wages: 1800000, covered: true, esi_ee: 13500, esi_er: 58500}

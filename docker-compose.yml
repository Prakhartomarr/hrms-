name: hrms

# Local development infrastructure only. App roles run on the host with `pnpm dev`.
# Host ports are offset (5433, 6380, 1026, 8026) so this stack can run next to others.
services:
  postgres:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hrms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrms}
      POSTGRES_DB: ${POSTGRES_DB:-hrms}
      APP_DB_USER: ${APP_DB_USER:-hrms_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-hrms_app}
    ports: ['5433:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.10-bookworm
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6380:6379']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # Local SMTP catcher: every email the app sends lands here (UI http://localhost:8026).
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ['1026:1025', '8026:8025']
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  redisdata:
